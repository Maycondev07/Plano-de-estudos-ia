<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor — Início</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .chat-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 40px;
    }
    .msg-row {
      display: flex;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .msg-role {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--ink-dim);
      width: 70px;
      flex-shrink: 0;
      padding-top: 3px;
    }
    .msg-role.user { color: var(--accent); }
    .msg-content {
      line-height: 1.6;
      font-size: 15.5px;
    }
    .msg-content p { margin: 0 0 12px; }
    .msg-content p:last-child { margin-bottom: 0; }
    .msg-content strong { font-weight: 700; }
    .msg-content ul, .msg-content ol { margin: 0 0 12px; padding-left: 22px; }
    .msg-content li { margin-bottom: 4px; }
    .msg-content li > p { margin: 0; }
    .msg-content code {
      background: var(--panel-raised);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 0.9em;
    }
    .msg-content pre {
      background: var(--panel-raised);
      padding: 12px 14px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 0 0 12px;
    }
    .msg-content pre code { background: none; padding: 0; }
    .msg-content table { border-collapse: collapse; margin: 0 0 12px; width: 100%; font-size: 14px; }
    .msg-content th, .msg-content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
    .msg-content blockquote {
      border-left: 3px solid var(--accent-dim);
      margin: 0 0 12px;
      padding: 2px 14px;
      color: var(--ink-dim);
    }
    .msg-content h1, .msg-content h2, .msg-content h3 {
      font-family: var(--serif);
      margin: 16px 0 8px;
      font-size: 1.15em;
    }
    .msg-content h1:first-child, .msg-content h2:first-child, .msg-content h3:first-child { margin-top: 0; }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 40px 26px;
      display: flex;
      gap: 10px;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      padding: 12px 14px;
      font-size: 14.5px;
      line-height: 1.5;
      outline: none;
    }
    .save-banner {
      margin: 12px 40px 0;
      padding: 12px 14px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .error-banner {
      margin: 12px 40px 0;
      padding: 12px 14px;
      border: 1px solid var(--red);
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
    }

    /* ---------- Toasts (feedback de ações da IA) ---------- */
    #toast-stack {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
      max-width: 320px;
    }
    .toast {
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .toast.erro { border-left-color: var(--red); }
  </style>
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="chat-wrap" id="chat-wrap">
    <div class="messages" id="messages"></div>

    <div id="error-banner" class="error-banner"></div>

    <div class="composer">
      <textarea id="input" rows="2" placeholder="Peça uma explicação, tire uma dúvida ou peça um plano de estudos…"></textarea>
      <button class="btn btn-primary" id="send-btn">Enviar</button>
    </div>
  </div>

  <div id="toast-stack"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
