<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor — Plano de estudos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="page">
    <h1 class="page-title">Plano de estudos</h1>
    <p class="page-subtitle">
      Seus itens de cronograma, organizados por dia. Marque como concluído
      conforme for estudando, ou peça pro Professor montar/ajustar um plano
      inteiro pelo chat.
    </p>

    <div class="add-form" id="add-form">
      <input type="text" id="novo-titulo" placeholder="Título (ex: Funções — teoria + exercícios)" />
      <input type="text" id="nova-materia" placeholder="Matéria (opcional)" />
      <input type="date" id="nova-data" />
      <button class="btn btn-primary" id="add-btn">Adicionar</button>
    </div>

    <div id="lista"><div class="empty-state">Carregando…</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/authGate.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/plano.js"></script>
</body>
</html>
